<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - IT Asset Registry</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <header class="topbar">
    <div class="brand">
      <img src="logo.png" alt="" class="brand-logo">
      <span>IT Asset Registry</span>
    </div>
    <button id="logoutBtn" class="btn btn-light">Log out</button>
  </header>

  <main class="container">
    <div id="toast" class="toast" hidden></div>

    <section class="page-head">
      <div>
        <h2>IT assets</h2>
        <p class="muted"><span id="totalCount">0</span> recorded assets</p>
      </div>
      <a href="asset-form.html" class="btn btn-primary">Add IT asset</a>
    </section>

    <section class="card">
      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Find by name, position, department, IP, serial number or ID domain">
        <div class="toolbar-actions">
          <button id="exportPdf" class="btn btn-outline">Export PDF</button>
          <button id="exportExcel" class="btn btn-outline">Export Excel</button>
        </div>
      </div>

      <div class="table-wrap">
        <table id="assetTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Position</th>
              <th>Department</th>
              <th>IP Address</th>
              <th>CPU Serial Number</th>
              <th>Monitor Serial Number</th>
              <th>ID Domain</th>
              <th>Password Domain</th>
              <th class="col-actions">Actions</th>
            </tr>
          </thead>
          <tbody id="assetBody">
            <tr><td colspan="10" class="empty">Loading assets...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
