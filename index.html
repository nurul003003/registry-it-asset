<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - IT Asset Registry</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page" data-page="login">
  <div class="login-bg"></div>

  <main class="login-card">
    <img class="login-logo" src="logo.png" alt="Logo">
    <h1>IT Asset Registry</h1>
    <p class="muted">Sign in to manage your IT assets</p>

    <div id="loginError" class="alert" hidden></div>

    <form id="loginForm" autocomplete="off">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus>

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" name="password" required>
        <button type="button" class="eye-btn" data-target="password" aria-label="Show password" title="Show / hide password"></button>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
